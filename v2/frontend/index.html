    <!-- DNS prefetch & Preconnect to font CDNs for immediate font delivery -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- External fonts loaded in parallel via non-blocking link tags -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,600,700,900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />

  </body>
